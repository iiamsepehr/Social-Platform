<!DOCTYPE html>

<html>

<head>
    <title>Posts</title>
</head>

<body>

<h1>Posts</h1>

{% if request.user.is_authenticated %}

    <a href="{% url 'post_create' %}">
        Create Post
    </a>

{% endif %}

<hr>


{% for post in posts %}

    <article>

        <h2>
            <a href="{% url 'post_detail' post.id %}">
                {{ post.title }}
            </a>
        </h2>

        <p>
            Author:
            {{ post.author.username }}
        </p>

        <p>
            Created:
            {{ post.created_at }}
        </p>

    </article>

    <hr>

{% empty %}

    <p>
        No posts yet.
    </p>

{% endfor %}

</body>

</html>
