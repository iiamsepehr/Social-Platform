<!DOCTYPE html>

<html>

<head>
    <title>Users</title>
</head>

<body>

<h1>
    Users
</h1>


<table border="1">

    <thead>

        <tr>

            <th>
                Username
            </th>

            <th>
                Email
            </th>

            <th>
                Role
            </th>

            <th>
                Created At
            </th>

            <th>
                Banned
            </th>

            <th>
                Timeout Until
            </th>

        </tr>

    </thead>


    <tbody>

        {% for user in users %}

        <tr>

            <td>
                {{ user.username }}
            </td>

            <td>
                {{ user.email }}
            </td>

            <td>
                {{ user.role }}
            </td>

            <td>
                {{ user.created_at }}
            </td>

            <td>
                {{ user.is_banned }}
            </td>

            <td>
                {{ user.timeout_until }}
            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>


<br>

<a href="{% url 'profile' %}">
    Back to Profile
</a>

</body>

</html>
